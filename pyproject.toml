[project]
name = "accrual-variance-review"
version = "0.1.0"
description = "Long-running BFSI accrual-variance agent demo on Atlas Agent Engine + Deep Agents VFS + S3"
requires-python = ">=3.11"
dependencies = [
    "pymongo>=4.7,<5",
    "boto3>=1.34,<2",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
# Platform path (agentengine dev up / build / deploy). agent-engine-sdk-langgraph
# is published from a private index until its first public release — install via
# the private index or a vendored wheels/ directory; see deploy/README.md.
platform = [
    "agent-engine-sdk-langgraph",
    "deepagents",
    "langchain-mongodb-deepagents-vfs[bedrock]",
    "langchain-openai>=0.3",
    "langchain-anthropic>=0.3",
]
ui = ["streamlit>=1.32,<2"]
test = ["pytest>=8,<9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
